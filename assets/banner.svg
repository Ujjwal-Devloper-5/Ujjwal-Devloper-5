<svg width="100%" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="50%" stop-color="#8957E5" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <!-- Subtle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="220" rx="16" fill="url(#bg-grad)" />
  <rect width="1000" height="220" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="150" cy="40" r="90" fill="#58A6FF" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="850" cy="180" r="110" fill="#8957E5" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Top Accent Terminal Bar -->
  <rect x="0" y="0" width="1000" height="4" fill="url(#accent-grad)" rx="2"/>

  <!-- Status Indicator Dot & Subhead -->
  <circle cx="50" cy="48" r="4" fill="#238636" />
  <text x="64" y="52" fill="#7EE787" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">PRODUCTION SYSTEMS • READY TO SCALE</text>

  <!-- Main Name Title -->
  <text x="50" y="115" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">UJJWAL KUMAR</text>

  <!-- Professional Subtitle -->
  <text x="52" y="152" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1.2">AI SYSTEMS &amp; PLATFORM ENGINEER</text>
  <text x="445" y="152" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">|</text>
  <text x="460" y="152" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="0.5">Distributed Infrastructure &amp; Cloud</text>

  <!-- Bottom Tech Tags -->
  <g transform="translate(52, 178)">
    <text x="0" y="16" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">KAFKA • KUBERNETES • EDGE AI • LINUX KERNEL • GITOPS • ANSIBLE • TERRAFORM</text>
  </g>

  <!-- Bottom Subtle Border -->
  <rect x="0" y="217" width="1000" height="3" fill="#30363D" opacity="0.8"/>
</svg>
